[project]
name = "buzzin"
version = "0.1.0"
description = "A live buzzer trivia game for a whole room."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.153.0",
    "uvicorn==0.54.0",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
timeout = 30
