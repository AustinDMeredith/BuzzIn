<div id="screen" hx-swap-oob="true">
  <form id="display" ws-send hx-vals='{"type": "join"}'>
      <label for="player">Enter your username</label>
      <input type="text" id="player" name="player" autocomplete="off" autofocus>
      <button id="submit" type="submit">Join</button>
  </form>
  {% if error %}
  <p class="error">{{ error }}</p>
  {% endif %}
</div>
