<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BuzzIn</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <script src="https://unpkg.com/htmx-ext-ws@2.0.1/ws.js"></script>
</head>
<body hx-ext="ws" ws-connect="/ws">
    <h1>BuzzIn</h1>
    <!-- TODO: join form, question display, buzzer button, leaderboard -->
    <!-- display form start out as a username input, 
        then gets updated as the game goes on -->
    <form id="display" ws-send>
        <label for="player">Enter your username</label>
        <input type="text" id="player" name="player">
    </form>
    <button ws-send hx-trigger="click" hx-vals='{"type": "join", player}'>
        Join
    </button>
    <script src="/static/js/buzz.js"></script>
</body>
</html>
